<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>深海艇ネレイド</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&family=Saira+Condensed:wght@500;700&display=swap">
<!-- Supabase JS(UMD)。読み込めなければ window.supabase は undefined になり、
     オンライン機能を無効化して単独訓練だけで動作する。 -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ── 単一テーマ：深海艇の船内。塗装鋼板と刻印ラベルの世界に統一する ── */
:root{
  --hull:#232c2b;
  --hull-deep:#18201f;
  --panel:#2f3b39;
  --recess:#141a19;
  --stroke:#0d1211;
  --ivory:#e9e4d6;
  --ivory-dim:#96a19c;
  --ivory-faint:#5e6a66;
  --brass:#d09a42;
  --sea:#7fc19b;
  --signal:#57aecb;
  --rust:#c4523a;
  --warn:#e0a53c;
  --accent:var(--brass);

  --f-jp:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --f-en:"Saira Condensed","Arial Narrow",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--hull-deep);
  color:var(--ivory);
  font-family:var(--f-jp);
  font-size:14px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--warn);outline-offset:2px}

.hull{
  min-height:100svh;display:grid;grid-template-rows:auto 1fr auto;
  background:radial-gradient(120% 80% at 50% -10%, #2c3736 0%, var(--hull) 45%, var(--hull-deep) 100%);
}

/* ── 上部レール ── */
.rail{
  display:flex;align-items:center;gap:22px;flex-wrap:wrap;padding:10px 20px;
  background:linear-gradient(#2b3634,#212a29);
  border-bottom:2px solid var(--stroke);box-shadow:0 3px 0 rgba(0,0,0,.35);
}
.mark{display:flex;align-items:baseline;gap:9px;margin-right:auto}
.mark b{font-weight:900;font-size:16px;letter-spacing:.06em}
.mark span{font-family:var(--f-en);font-weight:500;font-size:11px;letter-spacing:.22em;color:var(--ivory-faint)}
.gauge{display:flex;align-items:baseline;gap:8px}
.gauge .cap{font-family:var(--f-en);font-weight:700;font-size:10px;letter-spacing:.18em;color:var(--ivory-faint)}
.gauge .val{font-family:var(--f-en);font-weight:700;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.gauge .unit{font-family:var(--f-en);font-size:12px;color:var(--ivory-dim)}
#depthVal{color:var(--signal)}
#hullVal.hurt{color:var(--warn)}
#hullVal.crit{color:var(--rust)}
#hullVal{color:var(--sea)}
.hullbar{width:120px;height:7px;background:var(--recess);border:1px solid var(--stroke);overflow:hidden}
.hullbar i{display:block;height:100%;background:var(--sea);transition:width .25s linear,background .25s}
.hullbar i.hurt{background:var(--warn)}
.hullbar i.crit{background:var(--rust)}
.railbtn{
  font-family:var(--f-en);font-weight:700;font-size:11px;letter-spacing:.16em;
  color:var(--ivory-dim);border:1px solid #3f4d4a;padding:5px 10px;background:#26302f;
}
.railbtn:hover{color:var(--ivory);border-color:var(--ivory-faint)}

/* ── 主舞台 ── */
.stage{display:grid;gap:16px;padding:16px 20px 8px;align-content:start}
.stage.solo{grid-template-columns:minmax(0,1fr)}
.stage.drill{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:900px){.stage.drill{grid-template-columns:minmax(0,1fr)}}
.station{display:flex;flex-direction:column;gap:12px;min-width:0}
.stage.solo .station{width:100%;max-width:1080px;margin-inline:auto}
.station__head{display:flex;align-items:baseline;gap:10px;padding-left:2px}
.station__head b{font-weight:900;font-size:15px;letter-spacing:.05em;color:var(--accent)}
.station__head span{font-family:var(--f-en);font-weight:500;font-size:10px;letter-spacing:.2em;color:var(--ivory-faint)}

/* ── 指令札 ── */
.order{
  position:relative;background:linear-gradient(#333f3d,#28322f);
  border:2px solid var(--stroke);border-left:6px solid var(--accent);
  padding:14px 18px 0;min-height:104px;
  display:flex;flex-direction:column;justify-content:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
}
.order__tag{font-family:var(--f-en);font-weight:700;font-size:10px;letter-spacing:.2em;color:var(--ivory-faint);margin-bottom:4px}
.order__text{font-weight:900;font-size:clamp(20px,2.9vw,34px);line-height:1.25;text-wrap:balance}
.order__idle{font-weight:400;font-size:15px;color:var(--ivory-faint)}
.order__timer{position:absolute;left:0;right:0;bottom:0;height:6px;background:var(--recess)}
.order__timer i{display:block;height:100%;background:var(--accent);width:100%}
.order.urgent{border-left-color:var(--rust);background:linear-gradient(#3b302e,#2c2523)}
.order.urgent .order__tag{color:var(--rust)}
.order.urgent .order__timer i{background:var(--rust)}
.order.flash-ok{animation:flashOk .45s ease-out}
.order.flash-bad{animation:flashBad .45s ease-out}
@keyframes flashOk{0%{background:#3d5b4b}100%{background:#28322f}}
@keyframes flashBad{0%{background:#5b3229}100%{background:#28322f}}

/* ── 計器盤 ── */
.panel{
  display:grid;gap:10px;grid-template-columns:repeat(3,minmax(0,1fr));
  padding:12px;background:linear-gradient(#2a3433,#242d2c);border:2px solid var(--stroke);
}
.stage.drill .panel{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:1180px){.stage.drill .panel{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){.panel{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:460px){.panel{grid-template-columns:minmax(0,1fr)}}
.ctrl{
  display:flex;flex-direction:column;gap:7px;padding:9px 10px 8px;
  background:var(--panel);border:1px solid #1b2322;border-top:1px solid #45524f;min-width:0;
}
.ctrl__label{display:flex;flex-direction:column;gap:1px;min-width:0}
.ctrl__label b{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctrl__label span{font-family:var(--f-en);font-weight:500;font-size:9px;letter-spacing:.16em;color:var(--ivory-faint)}
.ctrl__read{
  font-family:var(--f-en);font-weight:700;font-size:14px;letter-spacing:.04em;
  font-variant-numeric:tabular-nums;color:var(--accent);
  background:var(--recess);border:1px solid var(--stroke);
  padding:1px 7px;align-self:flex-start;min-width:62px;text-align:center;
}
.notch{position:relative;padding:9px 4px 3px}
.notch__track{position:relative;height:5px;background:var(--recess);border:1px solid var(--stroke)}
.notch__pin{
  position:absolute;top:-7px;width:13px;height:19px;margin-left:-6.5px;
  background:linear-gradient(#e6e0d0,#a8a698);border:1px solid #12100c;
  transition:left .12s cubic-bezier(.3,1.4,.5,1);
}
.notch__stops{display:flex;margin-top:5px}
.notch__stops button{flex:1;font-family:var(--f-en);font-weight:500;font-size:10px;color:var(--ivory-faint);padding:2px 0;border-top:1px solid #3d4a47}
.notch__stops button:hover{color:var(--ivory);background:#38443f}
.notch__stops button[aria-checked="true"]{color:var(--accent);font-weight:700}
.lamps{display:flex;flex-direction:column;gap:3px}
.lamps button{display:flex;align-items:center;gap:7px;padding:3px 7px;background:var(--recess);border:1px solid var(--stroke);font-size:12px;color:var(--ivory-dim);text-align:left}
.lamps button:hover{background:#1d2524;color:var(--ivory)}
.lamps .dot{width:8px;height:8px;border-radius:50%;background:#2f3b39;border:1px solid #0a0e0d;flex:none}
.lamps button[aria-checked="true"]{color:var(--ivory)}
.lamps button[aria-checked="true"] .dot{background:var(--accent);box-shadow:0 0 7px var(--accent)}
.rocker{position:relative;display:flex;height:36px;background:var(--recess);border:1px solid var(--stroke)}
.rocker__slab{position:absolute;top:2px;bottom:2px;width:calc(50% - 3px);left:2px;background:linear-gradient(#4a5754,#33403d);border:1px solid #12100c;transition:left .14s cubic-bezier(.3,1.4,.5,1)}
.rocker__slab.on{left:calc(50% + 1px)}
.rocker button{position:relative;flex:1;font-size:12px;font-weight:700;color:var(--ivory-faint)}
.rocker button[aria-checked="true"]{color:var(--accent)}
.punch{
  align-self:center;width:62px;height:62px;border-radius:50%;
  background:repeating-linear-gradient(135deg,#c4523a 0 8px,#8f3a29 8px 16px);
  border:3px solid #1b1512;box-shadow:0 4px 0 #14100e, inset 0 2px 4px rgba(255,255,255,.18);
  font-family:var(--f-en);font-weight:700;font-size:11px;letter-spacing:.12em;color:#fff2e6;
  text-shadow:0 1px 2px rgba(0,0,0,.6);
}
.punch:active{transform:translateY(3px);box-shadow:0 1px 0 #14100e, inset 0 2px 4px rgba(0,0,0,.3)}
.ctrl--button{align-items:center}
.ctrl--button .ctrl__label{align-items:center;text-align:center}
.ctrl--button .ctrl__read{align-self:center}

/* ── 乗員レール ── */
.crew{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 20px 14px;border-top:2px solid var(--stroke);background:linear-gradient(#212a29,#1b2322)}
.crew__cap{font-family:var(--f-en);font-weight:700;font-size:10px;letter-spacing:.2em;color:var(--ivory-faint)}
.seat{display:flex;align-items:center;gap:8px;padding:4px 10px;background:#26302f;border:1px solid #36423f;min-width:150px}
.seat .dot{width:7px;height:7px;border-radius:50%;background:var(--ivory-faint);flex:none}
.seat.live .dot{background:var(--sea);box-shadow:0 0 6px var(--sea)}
.seat.me{border-color:var(--warn)}
.seat b{font-weight:700;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat span{font-family:var(--f-en);font-size:10px;letter-spacing:.14em;color:var(--ivory-faint);margin-left:auto}
.seat.ready span{color:var(--sea)}

/* ── 幕 ── */
.veil{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(14,19,18,.88);overflow-y:auto}
.veil[hidden]{display:none}
.card{width:min(700px,100%);background:linear-gradient(#2d3836,#242d2c);border:2px solid var(--stroke);box-shadow:0 18px 50px rgba(0,0,0,.55);padding:26px 30px 24px}
.card h1{margin:0;font-weight:900;font-size:30px;letter-spacing:.04em}
.card .sub{font-family:var(--f-en);font-weight:500;font-size:11px;letter-spacing:.28em;color:var(--ivory-faint);margin-top:2px}
.card .lede{margin:14px 0 0;color:var(--ivory-dim);max-width:62ch}
.rule{height:1px;background:#3b4744;margin:18px 0}
.steps{display:flex;flex-direction:column;gap:9px;margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{display:flex;gap:11px;align-items:flex-start}
.steps li::before{counter-increment:s;content:counter(s);font-family:var(--f-en);font-weight:700;font-size:12px;color:var(--hull);background:var(--accent);width:19px;height:19px;flex:none;display:grid;place-items:center;margin-top:2px}
.steps b{font-weight:700}
.steps p{margin:0;color:var(--ivory-dim);font-size:13px}
.note{margin-top:16px;padding:9px 12px;border-left:3px solid var(--warn);background:rgba(224,165,60,.08);color:var(--ivory-dim);font-size:12.5px}
.note.bad{border-left-color:var(--rust);background:rgba(196,82,58,.1)}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;align-items:center}
.btn{padding:11px 22px;font-weight:700;font-size:14px;background:var(--accent);color:#1a2120;border:1px solid var(--stroke)}
.btn:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.btn--ghost{background:transparent;color:var(--ivory-dim);border:1px solid #46534f}
.btn--ghost:hover{color:var(--ivory);border-color:var(--ivory-faint);filter:none}
.field{background:var(--recess);border:1px solid var(--stroke);color:var(--ivory);font:inherit;font-size:14px;padding:10px 12px}
.field::placeholder{color:var(--ivory-faint)}

.link{
  display:flex;align-items:center;gap:10px;margin-top:14px;padding:9px 12px;
  background:var(--recess);border:1px solid var(--stroke);
}
.link input{flex:1;min-width:0;background:none;border:none;color:var(--ivory-dim);font-family:var(--f-en);font-size:13px;letter-spacing:.02em}
.link button{font-family:var(--f-en);font-weight:700;font-size:11px;letter-spacing:.14em;color:var(--warn);white-space:nowrap}

.status{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ivory-dim);margin-top:14px}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--ivory-faint);flex:none}
.status.live .dot{background:var(--sea);box-shadow:0 0 7px var(--sea)}
.status.err .dot{background:var(--rust);box-shadow:0 0 7px var(--rust)}

.result{display:flex;align-items:flex-end;gap:26px;flex-wrap:wrap;margin-top:6px}
.result .big{font-family:var(--f-en);font-weight:700;font-size:64px;line-height:.9;font-variant-numeric:tabular-nums;color:var(--signal)}
.result .big span{font-size:22px;color:var(--ivory-dim);margin-left:6px}
.tally{display:flex;gap:22px;flex-wrap:wrap}
.tally div{display:flex;flex-direction:column}
.tally .cap{font-family:var(--f-en);font-weight:700;font-size:10px;letter-spacing:.18em;color:var(--ivory-faint)}
.tally .num{font-family:var(--f-en);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.roster{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.roster .row{display:flex;align-items:center;gap:10px;padding:6px 10px;background:var(--recess);border:1px solid var(--stroke);font-size:13px}
.roster .row .dot{width:7px;height:7px;border-radius:50%;background:var(--sea);box-shadow:0 0 6px var(--sea);flex:none}
.roster .row .st{font-family:var(--f-en);font-size:10px;letter-spacing:.16em;color:var(--ivory-faint);margin-left:auto}
.roster .row.ready .st{color:var(--sea)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
</style>
</head>
<body>

<div class="hull">
  <header class="rail">
    <div class="mark"><b>深海艇ネレイド</b><span>DSV NEREID / 3-SEAT DIVE</span></div>
    <div class="gauge"><div class="cap">DEPTH</div><div class="val" id="depthVal">0</div><div class="unit">m</div></div>
    <div class="gauge">
      <div class="cap">HULL</div><div class="val" id="hullVal">100</div><div class="unit">%</div>
      <div class="hullbar"><i id="hullBar" style="width:100%"></i></div>
    </div>
    <button class="railbtn" id="soundBtn" aria-pressed="true">SOUND ON</button>
    <button class="railbtn" id="helpBtn">手順</button>
  </header>
  <main class="stage solo" id="stage"></main>
  <footer class="crew">
    <div class="crew__cap">CREW</div>
    <div id="crewList" style="display:flex;gap:8px;flex-wrap:wrap"></div>
  </footer>
</div>

<div class="veil" id="veil"><div class="card" id="card"></div></div>

<script>
"use strict";

/* ══════════════════════════════════════════════════════════
   接続先 ── ChargeShot と同じ Supabase プロジェクトに相乗り。
   Realtime の Broadcast / Presence はテーブルを使わないので、
   既存の scores テーブルには一切触れない。
   ══════════════════════════════════════════════════════════ */
const SB_URL = "https://najwgwjahgxupqozoxgl.supabase.co";
const SB_KEY = "sb_publishable_waza3VO5fUVGhnn2-nRc1Q_yCwNWjBx";

/* ══════════════════════════════════════════════════════════
   計器目録 ── 3局。指令は必ず「他人の局の計器」を指す
   ══════════════════════════════════════════════════════════ */
const STATIONS = [
  { jp:"機関室", en:"ENGINE ROOM", accent:"var(--brass)", controls:[
    { id:"e1", jp:"主機出力",   en:"MAIN DRIVE",    type:"notch",  unit:"%",   vals:["0","25","50","75","100"] },
    { id:"e2", jp:"冷却水弁",   en:"COOLANT VALVE", type:"notch",  unit:"",    vals:["閉","1","2","3","全開"] },
    { id:"e3", jp:"蓄電池",     en:"BATTERY BUS",   type:"select", unit:"",    vals:["A系","B系","並列"] },
    { id:"e4", jp:"非常発電",   en:"EMERG GEN",     type:"toggle", unit:"",    vals:["停止","起動"] },
    { id:"e5", jp:"推力偏向",   en:"THRUST VECTOR", type:"notch",  unit:"°",   vals:["−30","−15","0","+15","+30"] },
    { id:"e6", jp:"過負荷遮断", en:"OVERLOAD CUT",  type:"button", unit:"",    vals:["打鍵"] },
  ]},
  { jp:"生命維持", en:"LIFE SUPPORT", accent:"var(--sea)", controls:[
    { id:"l1", jp:"酸素分圧",   en:"O2 PARTIAL",    type:"notch",  unit:"bar", vals:["0.18","0.21","0.24","0.28","0.32"] },
    { id:"l2", jp:"炭酸吸収",   en:"CO2 SCRUBBER",  type:"select", unit:"",    vals:["停止","低速","高速"] },
    { id:"l3", jp:"艙内与圧",   en:"CABIN PRESS",   type:"notch",  unit:"bar", vals:["1.0","1.4","1.8","2.2","2.6"] },
    { id:"l4", jp:"循環ファン", en:"CIRC FAN",      type:"toggle", unit:"",    vals:["停止","起動"] },
    { id:"l5", jp:"予備空気",   en:"RESERVE AIR",   type:"select", unit:"",    vals:["封鎖","均圧","開放"] },
    { id:"l6", jp:"警報消音",   en:"ALARM MUTE",    type:"button", unit:"",    vals:["打鍵"] },
  ]},
  { jp:"操艦", en:"HELM", accent:"var(--signal)", controls:[
    { id:"h1", jp:"主バラスト", en:"MAIN BALLAST",  type:"notch",  unit:"",    vals:["注水","半注","中立","半排","排水"] },
    { id:"h2", jp:"トリム角",   en:"TRIM ANGLE",    type:"notch",  unit:"°",   vals:["−10","−5","0","+5","+10"] },
    { id:"h3", jp:"ソナー利得", en:"SONAR GAIN",    type:"notch",  unit:"",    vals:["0","25","50","75","100"] },
    { id:"h4", jp:"投光器",     en:"FLOODLIGHT",    type:"toggle", unit:"",    vals:["消灯","点灯"] },
    { id:"h5", jp:"マニピュレータ", en:"MANIPULATOR", type:"select", unit:"", vals:["格納","待機","展開"] },
    { id:"h6", jp:"緊急吹鳴",   en:"EMERG HORN",    type:"button", unit:"",    vals:["打鍵"] },
  ]},
];

const GOAL = 2000, HULL_MAX = 100, MISS_COST = 18, SLIP_COST = 4;
const SEAT_EN = ["ENGINE","LIFE","HELM"];
const ctrlOf = (seat,id) => STATIONS[seat].controls.find(c => c.id === id);
const gainFor = d => 35 + Math.floor(d/300)*10;
const timerFor = d => Math.max(6500, 16000 - d*7);

/* ══════════════════════════════════════════════════════════
   状態
   ══════════════════════════════════════════════════════════ */
const MY_ID = Math.random().toString(36).slice(2,10);
let mode = "idle";            // idle | drill | online
let nick = "";
let myReady = false;
let showBrief = false;        // 「説明に戻る」を押した本人だけ説明画面にする
let lastVeilKey = "";         // 幕の再描画が要るかの判定用
let roomCode = "";

let sb = null, ch = null;
let net = "idle";             // idle | connecting | live | error
let netMsg = "";
let roster = [];              // [{id,name,ready}] id昇順
let mirror = null, mirrorAt = 0;   // 追従側が受け取った進行状態

let game = null;                    // 艇長が持つ正本
const panels = [{},{},{}];          // 艇長・訓練が持つ正本の盤面
const pending = {};                 // 自分の操作の先行反映 {ctrlId:{v,until}}
let evSeen = 0, evSeq = 0, orderId = 0;

const ui = { seats:[], rendered:null };

function freshPanel(seat){ const p={}; for(const c of STATIONS[seat].controls) p[c.id]=0; return p; }
function resetPanels(){ for(let s=0;s<3;s++) panels[s]=freshPanel(s); }

/* ── 席と役割 ─────────────────────────────────── */
function amCaptain(){
  if(mode === "drill") return true;
  return roster.length > 0 && roster[0].id === MY_ID;
}
function seatOfId(id){
  const st = view();
  if(st && st.seats && st.seats.length) return st.seats.indexOf(id);
  return roster.findIndex(p => p.id === id);
}
function mySeat(){ return mode === "drill" ? 0 : seatOfId(MY_ID); }
function activeSeats(){
  if(mode === "drill") return [0,1,2];
  const st = game;
  if(st && st.seats && st.seats.length) return st.seats.map((_,i)=>i);
  return roster.slice(0,3).map((_,i)=>i);
}
function view(){ return (mode==="drill" || (mode==="online" && amCaptain())) ? game : mirror; }

/* 描画に使う盤面。艇長・訓練は正本、追従側は受信値＋自分の先行操作 */
function panelView(seat){
  if(mode === "drill" || amCaptain()) return panels[seat] || {};
  const st = mirror;
  const base = (st && st.pn && st.pn[seat]) ? st.pn[seat] : {};
  if(seat !== mySeat()) return base;
  const out = Object.assign({}, base);
  const now = performance.now();
  for(const k in pending){
    if(pending[k].until > now) out[k] = pending[k].v; else delete pending[k];
  }
  return out;
}

/* ══════════════════════════════════════════════════════════
   指令の生成
   ══════════════════════════════════════════════════════════ */
function makeOrder(reader, seats, st){
  const others = seats.filter(s => s !== reader);
  if(!others.length) return null;
  const taken = new Set(st.o.filter(Boolean).map(o => o.c));
  const pool = [];
  for(const s of others)
    for(const c of STATIONS[s].controls)
      if(!taken.has(c.id)) pool.push({ s, c });
  if(!pool.length) return null;

  const pick = pool[(Math.random()*pool.length)|0];
  const cur = panels[pick.s][pick.c.id] || 0;
  let want = 0, text = "";
  if(pick.c.type === "button"){
    want = cur;
    text = `${pick.c.jp}を叩け`;
  }else{
    const opts = pick.c.vals.map((_,i)=>i).filter(i => i !== cur);
    want = opts[(Math.random()*opts.length)|0];
    const label = pick.c.vals[want] + (pick.c.unit ? " "+pick.c.unit : "");
    text = pick.c.type === "toggle" ? `${pick.c.jp}を${label}` : `${pick.c.jp}を${label}に`;
  }
  const urgent = st.d >= 600 && Math.random() < 0.22;
  const tot = Math.round(timerFor(st.d) * (urgent ? 0.62 : 1));
  // 制限時間は絶対時刻で持つ。艇長のタブが裏に回って tick が間引かれても狂わない。
  return { i:++orderId, s:pick.s, c:pick.c.id, v:want, b:cur, t:text, end:Date.now()+tot, tot, u:urgent };
}
const leftOf = o => Math.max(0, o.end - Date.now());

/* ══════════════════════════════════════════════════════════
   進行（艇長のみ）
   ══════════════════════════════════════════════════════════ */
function newGame(){
  return { ph:"lobby", d:0, h:HULL_MAX, o:[null,null,null], ok:0, miss:0, slip:0,
           win:false, ev:[], prev:[{},{},{}], seats:[] };
}
function pushEv(seat, kind){
  game.ev.push({ i:++evSeq, s:seat, k:kind });
  if(game.ev.length > 5) game.ev.shift();
}
function startDive(){
  const seats = mode === "drill" ? ["_a","_b","_c"] : roster.slice(0,3).map(p => p.id);
  Object.assign(game, newGame(), { ph:"dive", seats });
  resetPanels();
  const idx = seats.map((_,i)=>i);
  for(const s of idx) game.prev[s] = Object.assign({}, panels[s]);
  for(const s of idx) game.o[s] = makeOrder(s, idx, game);
  broadcastState(true);
}

function applyAct(seat, ctrlId, v){
  if(seat < 0 || seat > 2) return;
  const c = ctrlOf(seat, ctrlId);
  if(!c) return;
  if(c.type === "button") panels[seat][ctrlId] = (panels[seat][ctrlId]||0) + 1;
  else panels[seat][ctrlId] = v;
}

function captainTick(){
  const st = game;
  // 潜航前(lobby)も結果表示中(over)も、全員が配置についた時点で開始する
  if(st.ph === "lobby" || st.ph === "over"){
    if(mode === "online" && roster.length >= 2 && roster.slice(0,3).every(p => p.ready)) startDive();
    return;
  }
  if(st.ph !== "dive") return;
  const seats = activeSeats();

  // 誤操作の検出（望まれた値かを先に照合するので、正しい操作は罰されない）
  for(const s of seats){
    const panel = panels[s], prev = st.prev[s] || {};
    for(const c of STATIONS[s].controls){
      const cur = panel[c.id]||0, was = prev[c.id]||0;
      if(cur === was) continue;
      const wanted = st.o.some(o => o && o.s === s && o.c === c.id &&
        (c.type === "button" ? true : o.v === cur));
      if(!wanted){ st.h -= SLIP_COST; st.slip++; pushEv(s,"slip"); }
    }
    st.prev[s] = Object.assign({}, panel);
  }

  // 指令の消化
  for(const s of seats){
    const o = st.o[s];
    if(!o){ st.o[s] = makeOrder(s, seats, st); broadcastState(true); continue; }
    const c = ctrlOf(o.s, o.c);
    const val = panels[o.s][o.c] || 0;
    const done = c.type === "button" ? val > o.b : val === o.v;
    if(done){ st.d += gainFor(st.d); st.ok++; pushEv(s,"ok"); st.o[s] = null; }
    else if(leftOf(o) <= 0){ st.h -= MISS_COST; st.miss++; pushEv(s,"miss"); st.o[s] = null; }
  }

  if(st.h <= 0){ st.h = 0; st.ph = "over"; st.win = false; st.o = [null,null,null]; broadcastState(true); }
  else if(st.d >= GOAL){ st.d = GOAL; st.ph = "over"; st.win = true; st.o = [null,null,null]; broadcastState(true); }
}

/* ══════════════════════════════════════════════════════════
   通信 ── Supabase Realtime（Broadcast + Presence）
   ══════════════════════════════════════════════════════════ */
function channelName(){ return "nereid-" + (roomCode || "MAIN"); }

function setNet(s, msg){ net = s; netMsg = msg || ""; drawVeil(); drawCrew(); }

async function connect(){
  if(!window.supabase || !window.supabase.createClient){
    setNet("error", "Supabase ライブラリを読み込めませんでした（通信が遮断されている可能性）。");
    return;
  }
  try{
    if(ch){ await sb.removeChannel(ch); ch = null; }
    if(!sb) sb = window.supabase.createClient(SB_URL, SB_KEY, { realtime:{ params:{ eventsPerSecond:20 } } });
    setNet("connecting", "");

    ch = sb.channel(channelName(), {
      config:{ broadcast:{ self:false }, presence:{ key: MY_ID } }
    });

    ch.on("presence", { event:"sync" }, () => {
      const state = ch.presenceState();
      roster = Object.keys(state).map(k => {
        const m = state[k][0] || {};
        return { id: m.id || k, name: m.name || "乗員", ready: !!m.ready };
      }).sort((a,b) => a.id < b.id ? -1 : a.id > b.id ? 1 : 0);
      if(amCaptain() && !game) game = newGame();
      layout(); drawCrew(); drawVeil();
    });

    ch.on("broadcast", { event:"state" }, ({ payload }) => {
      if(amCaptain()) return;               // 艇長は自分の正本を使う
      mirror = payload; mirrorAt = performance.now();
    });

    ch.on("broadcast", { event:"act" }, ({ payload }) => {
      if(!amCaptain() || !game || game.ph !== "dive") return;
      applyAct(payload.seat, payload.c, payload.v);
      captainTick();          // 受信即判定。裏タブで tick が間引かれても反応が遅れない
    });

    ch.subscribe(async (status, err) => {
      if(status === "SUBSCRIBED"){
        setNet("live", "");
        await ch.track({ id: MY_ID, name: nick || "乗員", ready: myReady });
      }else if(status === "CHANNEL_ERROR"){
        setNet("error", (err && err.message) ? err.message : "チャンネルに接続できませんでした。");
      }else if(status === "TIMED_OUT"){
        setNet("error", "接続がタイムアウトしました。");
      }else if(status === "CLOSED"){
        if(net === "live") setNet("connecting", "");
      }
    });
  }catch(e){
    setNet("error", String(e && e.message || e));
  }
}

async function trackMe(){
  if(ch && net === "live"){ try{ await ch.track({ id:MY_ID, name:nick||"乗員", ready:myReady }); }catch(e){} }
}

let lastCast = 0;
function broadcastState(force){
  if(mode !== "online" || !amCaptain() || !ch || net !== "live" || !game) return;
  const t = performance.now();
  if(!force && t - lastCast < 200) return;
  lastCast = t;
  ch.send({ type:"broadcast", event:"state", payload:{
    ph:game.ph, d:Math.round(game.d), h:Math.max(0,Math.round(game.h)),
    ok:game.ok, miss:game.miss, slip:game.slip, win:game.win, seats:game.seats,
    o:game.o.map(o => o ? { i:o.i, s:o.s, c:o.c, t:o.t, ms:leftOf(o), tot:o.tot, u:o.u } : null),
    pn:panels, ev:game.ev.slice(-3),
  }}).catch(()=>{});
}

function sendAct(seat, ctrlId, v){
  if(mode !== "online") return;
  if(amCaptain()){ applyAct(seat, ctrlId, v); broadcastState(true); return; }
  pending[ctrlId] = { v, until: performance.now() + 700 };
  if(ch && net === "live") ch.send({ type:"broadcast", event:"act", payload:{ seat, c:ctrlId, v } }).catch(()=>{});
}

/* ══════════════════════════════════════════════════════════
   盤面の組み立て
   ══════════════════════════════════════════════════════════ */
const stage = document.getElementById("stage");
function seatsToRender(){
  if(mode === "drill") return [0,1,2];
  const s = mySeat();
  return (s >= 0 && s < 3) ? [s] : [];
}
function layout(){
  const seats = seatsToRender();
  const key = mode + ":" + seats.join(",");
  if(ui.rendered === key) return;
  ui.rendered = key;
  stage.className = "stage " + (seats.length > 1 ? "drill" : "solo");
  stage.textContent = "";
  ui.seats = [];
  for(const s of seats) stage.appendChild(buildStation(s));
}

function buildStation(seat){
  const st = STATIONS[seat];
  const wrap = document.createElement("section");
  wrap.className = "station";
  wrap.style.setProperty("--accent", st.accent);

  const head = document.createElement("div");
  head.className = "station__head";
  head.innerHTML = "<b></b><span></span>";
  head.children[0].textContent = st.jp;
  head.children[1].textContent = st.en;
  wrap.appendChild(head);

  const order = document.createElement("div");
  order.className = "order";
  order.innerHTML = '<div class="order__tag">ORDER</div>' +
                    '<div class="order__text order__idle">待機中</div>' +
                    '<div class="order__timer"><i></i></div>';
  wrap.appendChild(order);

  const panel = document.createElement("div");
  panel.className = "panel";
  const refs = [];
  for(const c of st.controls) refs.push(buildControl(seat, c, panel));
  wrap.appendChild(panel);

  ui.seats[seat] = { order, orderText:order.querySelector(".order__text"),
                     tag:order.querySelector(".order__tag"),
                     timer:order.querySelector(".order__timer i"),
                     controls:refs, lastOrderId:0 };
  return wrap;
}

function setValue(seat, c, v){
  if(mode === "drill"){
    if(c.type === "button") panels[seat][c.id] = (panels[seat][c.id]||0)+1;
    else panels[seat][c.id] = v;
  }else{
    sendAct(seat, c.id, v);
  }
  paintControls();
  blip(c.type === "button" ? 520 : 340, 0.045);
}

function buildControl(seat, c, parent){
  const box = document.createElement("div");
  box.className = "ctrl ctrl--" + c.type;
  const label = document.createElement("div");
  label.className = "ctrl__label";
  label.innerHTML = "<b></b><span></span>";
  label.children[0].textContent = c.jp;
  label.children[1].textContent = c.en;
  box.appendChild(label);

  const read = document.createElement("div");
  read.className = "ctrl__read";
  const opts = [];
  let pin = null, slab = null;

  if(c.type === "notch"){
    const w = document.createElement("div");
    w.className = "notch";
    w.innerHTML = '<div class="notch__track"><div class="notch__pin"></div></div><div class="notch__stops"></div>';
    pin = w.querySelector(".notch__pin");
    const stops = w.querySelector(".notch__stops");
    c.vals.forEach((v,i) => {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = v; b.setAttribute("role","radio");
      b.setAttribute("aria-label", c.jp + " " + v);
      b.addEventListener("click", () => setValue(seat, c, i));
      stops.appendChild(b); opts.push(b);
    });
    box.appendChild(w);
  }else if(c.type === "select"){
    const w = document.createElement("div");
    w.className = "lamps";
    c.vals.forEach((v,i) => {
      const b = document.createElement("button");
      b.type = "button"; b.setAttribute("role","radio");
      b.innerHTML = '<i class="dot"></i><span></span>';
      b.querySelector("span").textContent = v;
      b.setAttribute("aria-label", c.jp + " " + v);
      b.addEventListener("click", () => setValue(seat, c, i));
      w.appendChild(b); opts.push(b);
    });
    box.appendChild(w);
  }else if(c.type === "toggle"){
    const w = document.createElement("div");
    w.className = "rocker";
    w.innerHTML = '<div class="rocker__slab"></div>';
    slab = w.querySelector(".rocker__slab");
    c.vals.forEach((v,i) => {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = v; b.setAttribute("role","radio");
      b.setAttribute("aria-label", c.jp + " " + v);
      b.addEventListener("click", () => setValue(seat, c, i));
      w.appendChild(b); opts.push(b);
    });
    box.appendChild(w);
  }else{
    const b = document.createElement("button");
    b.type = "button"; b.className = "punch"; b.textContent = "PUSH";
    b.setAttribute("aria-label", c.jp + " を叩く");
    b.addEventListener("click", () => setValue(seat, c, 0));
    box.appendChild(b);
  }
  box.appendChild(read);
  parent.appendChild(box);
  return { c, seat, box, read, opts, pin, slab };
}

/* ══════════════════════════════════════════════════════════
   描画
   ══════════════════════════════════════════════════════════ */
function paintControls(){
  const st = view();
  for(const seat of seatsToRender()){
    const refs = ui.seats[seat];
    if(!refs) continue;
    const panel = panelView(seat);
    for(const r of refs.controls){
      const v = panel[r.c.id] || 0;
      if(r.c.type === "button"){
        r.read.textContent = v ? v + " 回" : "—";
      }else{
        r.read.textContent = r.c.vals[v] + (r.c.unit ? " " + r.c.unit : "");
        r.opts.forEach((b,i) => b.setAttribute("aria-checked", String(i === v)));
        if(r.pin) r.pin.style.left = ((v + 0.5) / r.c.vals.length * 100) + "%";
        if(r.slab) r.slab.classList.toggle("on", v === 1);
      }
    }
  }
}

function paintOrders(){
  const st = view();
  const drift = (mode === "online" && !amCaptain()) ? performance.now() - mirrorAt : 0;
  for(const seat of seatsToRender()){
    const refs = ui.seats[seat];
    if(!refs) continue;
    const o = (st && st.ph === "dive") ? st.o[seat] : null;
    if(!o){
      refs.orderText.classList.add("order__idle");
      refs.orderText.textContent = (st && st.ph === "dive") ? "次の指令を待て" : "待機中";
      refs.timer.style.width = "0%";
      refs.order.classList.remove("urgent");
      continue;
    }
    if(refs.lastOrderId !== o.i){ refs.lastOrderId = o.i; blip(o.u ? 880 : 660, 0.07); }
    refs.orderText.classList.remove("order__idle");
    refs.orderText.textContent = o.t;
    refs.order.classList.toggle("urgent", !!o.u);
    refs.tag.textContent = o.u ? "緊急指令 / PRIORITY" : "ORDER";
    const left = o.end ? leftOf(o) : Math.max(0, o.ms - drift);
    refs.timer.style.width = Math.max(0, Math.min(100, left / o.tot * 100)) + "%";
  }
}

const depthVal = document.getElementById("depthVal");
const hullVal = document.getElementById("hullVal");
const hullBar = document.getElementById("hullBar");
function paintRail(){
  const st = view();
  const d = st ? Math.round(st.d) : 0;
  const h = st ? Math.max(0, Math.round(st.h)) : HULL_MAX;
  depthVal.textContent = d.toLocaleString("ja-JP");
  hullVal.textContent = h;
  hullBar.style.width = (h / HULL_MAX * 100) + "%";
  const cls = h <= 30 ? "crit" : h <= 64 ? "hurt" : "";
  hullVal.className = "val " + cls;
  hullBar.className = cls;
}

const crewList = document.getElementById("crewList");
function drawCrew(){
  crewList.textContent = "";
  const add = (name, tag, live, me, ready) => {
    const el = document.createElement("div");
    el.className = "seat" + (live?" live":"") + (me?" me":"") + (ready?" ready":"");
    el.innerHTML = '<i class="dot"></i><b></b><span></span>';
    el.children[1].textContent = name;
    el.children[2].textContent = tag;
    crewList.appendChild(el);
  };
  if(mode === "drill"){ for(let s=0;s<3;s++) add(STATIONS[s].jp, "単独訓練", true, true, false); return; }
  if(!roster.length){ add(net === "error" ? "接続できません" : "接続中…", "", false, false, false); return; }
  roster.slice(0,4).forEach((p,i) => {
    add(p.name + (p.id === MY_ID ? "（あなた）" : ""), i < 3 ? SEAT_EN[i] : "観測", true, p.id === MY_ID, p.ready);
  });
}

/* ── 効果音 ── */
let ac = null, soundOn = true;
function blip(freq, len){
  if(!soundOn) return;
  try{
    if(!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if(ac.state === "suspended") ac.resume();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = "square"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.09, ac.currentTime + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + len);
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime + len + 0.02);
  }catch(e){}
}
const chord = (fs, len) => fs.forEach((f,i) => setTimeout(() => blip(f, len), i*55));

function playEvents(){
  const st = view();
  if(!st || !st.ev) return;
  const me = mySeat();
  for(const e of st.ev){
    if(e.i <= evSeen) continue;
    evSeen = e.i;
    const mine = mode === "drill" || e.s === me;
    if(e.k === "ok" && mine) chord([700,990], 0.06);
    else if(e.k === "miss") chord([300,180], 0.16);
    else if(e.k === "slip" && mine) blip(150, 0.1);
    const refs = ui.seats[e.s];
    if(refs && mine){
      const cls = e.k === "ok" ? "flash-ok" : "flash-bad";
      refs.order.classList.remove("flash-ok","flash-bad");
      void refs.order.offsetWidth;
      refs.order.classList.add(cls);
    }
  }
}

/* ══════════════════════════════════════════════════════════
   幕（説明・結果）
   ══════════════════════════════════════════════════════════ */
const veil = document.getElementById("veil");
const card = document.getElementById("card");
const esc = s => String(s).replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));

function drawVeil(){
  // 幕はカードごと作り直すので、入力中の焦点とカーソル位置を持ち越す
  const a = document.activeElement;
  const fid = (a && a.id) ? a.id : null;
  const pos = (a && typeof a.selectionStart === "number") ? a.selectionStart : null;
  renderVeil();
  if(fid){
    const el = document.getElementById(fid);
    if(el && el !== document.activeElement){
      el.focus();
      if(pos !== null && typeof el.selectionStart === "number"){
        try{ el.setSelectionRange(pos, pos); }catch(e){}
      }
    }
  }
}
function renderVeil(){
  const st = view();
  if(mode !== "idle" && st && st.ph === "dive"){ veil.hidden = true; showBrief = false; return; }

}

    <div class="roster" id="rosterBox"></div>
    <div class="acts">
      <input class="field" id="nickIn" maxlength="12" placeholder="乗員名" style="width:170px" value="${esc(nick)}">
      <input class="field" id="roomIn" maxlength="8" placeholder="合言葉(任意)" style="width:140px" value="${esc(roomCode)}">
      <button class="btn" id="readyBtn" ${net === "live" ? "" : "disabled"}>${myReady ? "配置を解く" : "配置につく"}</button>
      <button class="btn btn--ghost" id="drillBtn">単独訓練</button>
    </div>`;

  const rb = card.querySelector("#rosterBox");
  roster.forEach((p,i) => {
    const row = document.createElement("div");
    row.className = "row" + (p.ready ? " ready" : "");
    row.innerHTML = '<i class="dot"></i><b></b><span style="color:var(--ivory-dim);margin-left:8px"></span><span class="st"></span>';
    row.children[1].textContent = p.name + (p.id === MY_ID ? "（あなた）" : "");
    row.children[2].textContent = i < 3 ? STATIONS[i].jp : "観測員";
    row.children[3].textContent = p.ready ? "READY" : "STANDBY";
    rb.appendChild(row);
  });

  card.querySelector("#copyBtn").addEventListener("click", e => {
    const inp = card.querySelector("#shareUrl");
    inp.select();
    navigator.clipboard.writeText(inp.value).then(
      () => { e.target.textContent = "COPIED"; setTimeout(()=>{ e.target.textContent = "COPY"; }, 1400); },
      () => { e.target.textContent = "手動でコピー"; }
    );
  });
  card.querySelector("#nickIn").addEventListener("input", e => { nick = e.target.value.slice(0,12); trackMe(); });
  card.querySelector("#roomIn").addEventListener("change", e => {
    roomCode = e.target.value.replace(/[^A-Za-z0-9_-]/g, "").slice(0,8).toUpperCase();
    location.hash = roomCode;
    roster = []; myReady = false; game = null; mirror = null;
    connect();
  });
  card.querySelector("#readyBtn").addEventListener("click", () => {
    mode = "online";
    myReady = !myReady;
    if(amCaptain() && !game) game = newGame();
    trackMe(); layout(); drawCrew(); drawVeil();
    blip(760, 0.06);
  });
  card.querySelector("#drillBtn").addEventListener("click", () => {
    mode = "drill"; game = newGame(); startDive();
    ui.rendered = null; layout(); drawCrew(); drawVeil();
    chord([520,700], 0.07);
  });
}

const readyCount = () => roster.filter(p => p.ready).length;

function drawResult(st){
  card.innerHTML = `
    <h1>${st.win ? "海溝底に到達" : "圧壊"}</h1>
    <div class="sub">${st.win ? "DIVE COMPLETE" : "HULL BREACH"}</div>
    <div class="result">
      <div class="big">${Math.round(st.d).toLocaleString("ja-JP")}<span>m</span></div>
      <div class="tally">
        <div><div class="cap">ORDERS</div><div class="num">${st.ok}</div></div>
        <div><div class="cap">TIMEOUT</div><div class="num">${st.miss}</div></div>
        <div><div class="cap">MIS-OP</div><div class="num">${st.slip}</div></div>
      </div>
    </div>
    <p class="lede">${st.win
      ? "全員の声が通っていた。ネレイドは海溝底に着底し、採泥装置を展開した。"
      : "誰かの指令が誰にも届かないまま、水圧が耐圧殻を上回った。もう一度潜れ。"}</p>
    ${mode === "drill" ? "" :
      `<div class="status${readyCount() >= roster.length && roster.length >= 2 ? " live" : ""}">` +
      `<i class="dot"></i>再挑戦 ${readyCount()} / ${roster.length} 人 — 全員が押すと次の潜航が始まる</div>`}
    <div class="acts">
      <button class="btn" id="againBtn">${mode === "drill" ? "もう一度潜る" : (myReady ? "取り消す" : "もう一度潜る")}</button>
      <button class="btn btn--ghost" id="backBtn">説明に戻る</button>
    </div>`;
  card.querySelector("#againBtn").addEventListener("click", () => {
    if(mode === "drill"){ startDive(); drawVeil(); return; }
    myReady = !myReady;              // 全員が押した時点で艇長が次の潜航を始める
    trackMe(); drawVeil();
  });
  card.querySelector("#backBtn").addEventListener("click", () => {
    if(mode === "drill"){ mode = "idle"; game = null; ui.rendered = null; layout(); }
    myReady = false; showBrief = true;   // 説明画面は押した本人にだけ出す
    trackMe(); drawCrew(); drawVeil();
  });
}

/* ══════════════════════════════════════════════════════════
   主ループ
   ══════════════════════════════════════════════════════════ */
let prevPhase = null;

/* 進行と送信は setInterval で回す。requestAnimationFrame は裏タブで止まるため、
   艇長が他のタブを見た瞬間に全員のゲームが凍ってしまう。 */
setInterval(() => {
  if((mode === "drill" || (mode === "online" && amCaptain())) && game) captainTick();
  if(mode === "online") broadcastState(false);

  // 局面の変化もここで拾う。frame() は裏タブで止まるため当てにできない。
  const st = view();
  const ph = st ? st.ph : null;
  if(ph !== prevPhase){
    prevPhase = ph;
    if(ph === "dive"){
      // 潜航が始まったら配置の申告を必ず落とす。残したままだと結果画面から
      // 戻った瞬間に全員READY扱いになり、勝手に次の潜航が始まってしまう。
      myReady = false; trackMe();
      showBrief = false; ui.rendered = null; layout();
    }
    drawVeil(); drawCrew();
  }

  // 幕が出ている間は、他の乗員の配置状況を追随させる
  if(!veil.hidden){
    const key = ph + "|" + showBrief + "|" + myReady + "|" +
                roster.map(p => p.id + (p.ready ? "1" : "0") + p.name).join(",");
    if(key !== lastVeilKey){ lastVeilKey = key; drawVeil(); drawCrew(); }
  }
}, 100);

function frame(){
  paintRail(); paintOrders(); paintControls(); playEvents();
  requestAnimationFrame(frame);
}

/* ── 起動 ── */
document.getElementById("soundBtn").addEventListener("click", e => {
  soundOn = !soundOn;
  e.target.textContent = soundOn ? "SOUND ON" : "SOUND OFF";
  e.target.setAttribute("aria-pressed", String(soundOn));
  if(soundOn) blip(660, 0.06);
});
document.getElementById("helpBtn").addEventListener("click", () => {
  const st = view();
  if(st && st.ph === "dive") return;
  veil.hidden = false; drawBriefing();
});

roomCode = (location.hash || "").replace(/[^A-Za-z0-9_-]/g, "").slice(0,8).toUpperCase();
resetPanels();
layout(); drawCrew(); drawVeil();
requestAnimationFrame(frame);
connect();
</script>
</body>
</html>
