<title>深海艇ネレイド</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&family=Saira+Condensed:wght@500;700&display=swap">

<style>
/* ── 単一テーマ：深海艇の船内。塗装鋼板と刻印ラベルの世界に統一する ── */
:root{
  --hull:#232c2b;
  --hull-deep:#18201f;
  --panel:#2f3b39;
  --panel-hi:#3b4846;
  --recess:#141a19;
  --stroke:#0d1211;
  --ivory:#e9e4d6;
  --ivory-dim:#96a19c;
  --ivory-faint:#5e6a66;
  --brass:#d09a42;
  --sea:#7fc19b;
  --signal:#57aecb;
  --rust:#c4523a;
  --warn:#e0a53c;
  --accent:var(--brass);

  --f-jp:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --f-en:"Saira Condensed","Arial Narrow",sans-serif;
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--hull-deep);
  color:var(--ivory);
  font-family:var(--f-jp);
  font-size:14px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible{outline:2px solid var(--warn);outline-offset:2px}

/* ── 船体シェル ── */
.hull{
  min-height:100svh;
  display:grid;
  grid-template-rows:auto 1fr auto;
  background:
    radial-gradient(120% 80% at 50% -10%, #2c3736 0%, var(--hull) 45%, var(--hull-deep) 100%);
}

/* ── 上部レール：艇名・深度・船殻 ── */
.rail{
  display:flex;align-items:center;gap:22px;flex-wrap:wrap;
  padding:10px 20px;
  background:linear-gradient(#2b3634,#212a29);
  border-bottom:2px solid var(--stroke);
  box-shadow:0 3px 0 rgba(0,0,0,.35);
}
.mark{display:flex;align-items:baseline;gap:9px;margin-right:auto}
.mark b{font-weight:900;font-size:16px;letter-spacing:.06em}
.mark span{font-family:var(--f-en);font-weight:500;font-size:11px;letter-spacing:.22em;color:var(--ivory-faint)}

.gauge{display:flex;align-items:baseline;gap:8px}
.gauge .cap{
  font-family:var(--f-en);font-weight:700;font-size:10px;
  letter-spacing:.18em;color:var(--ivory-faint);
}
.gauge .val{
  font-family:var(--f-en);font-weight:700;font-size:26px;line-height:1;
  font-variant-numeric:tabular-nums;letter-spacing:.02em;
}
.gauge .unit{font-family:var(--f-en);font-size:12px;color:var(--ivory-dim)}
#depthVal{color:var(--signal)}
#hullVal{color:var(--sea)}
#hullVal.hurt{color:var(--warn)}
#hullVal.crit{color:var(--rust)}

.hullbar{width:120px;height:7px;background:var(--recess);border:1px solid var(--stroke);overflow:hidden}
.hullbar i{display:block;height:100%;background:var(--sea);transition:width .25s linear,background .25s}
.hullbar i.hurt{background:var(--warn)}
.hullbar i.crit{background:var(--rust)}

.railbtn{
  font-family:var(--f-en);font-weight:700;font-size:11px;letter-spacing:.16em;
  color:var(--ivory-dim);border:1px solid #3f4d4a;padding:5px 10px;background:#26302f;
}
.railbtn:hover{color:var(--ivory);border-color:var(--ivory-faint)}

/* ── 主舞台 ── */
.stage{
  display:grid;gap:16px;padding:16px 20px 8px;
  align-content:start;
}
.stage.solo{grid-template-columns:minmax(0,1fr)}
.stage.drill{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:900px){.stage.drill{grid-template-columns:minmax(0,1fr)}}

/* ── 局（ステーション）ブロック ── */
.station{display:flex;flex-direction:column;gap:12px;min-width:0}
.station__head{display:flex;align-items:baseline;gap:10px;padding-left:2px}
.station__head b{font-weight:900;font-size:15px;letter-spacing:.05em;color:var(--accent)}
.station__head span{font-family:var(--f-en);font-weight:500;font-size:10px;letter-spacing:.2em;color:var(--ivory-faint)}

/* ── 指令札：読み上げる対象。ここが主役 ── */
.order{
  position:relative;
  background:linear-gradient(#333f3d,#28322f);
  border:2px solid var(--stroke);
  border-left:6px solid var(--accent);
  padding:14px 18px 0;
  min-height:104px;
  display:flex;flex-direction:column;justify-content:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
}
.order__tag{
  font-family:var(--f-en);font-weight:700;font-size:10px;letter-spacing:.2em;
  color:var(--ivory-faint);margin-bottom:4px;
}
.order__text{
  font-weight:900;font-size:clamp(20px,2.9vw,34px);line-height:1.25;
  text-wrap:balance;letter-spacing:.01em;
}
.order__text em{font-style:normal;color:var(--warn)}
.order__idle{font-weight:400;font-size:15px;color:var(--ivory-faint)}
.order__timer{
  position:absolute;left:0;right:0;bottom:0;height:6px;background:var(--recess);
}
.order__timer i{display:block;height:100%;background:var(--accent);width:100%}
.order.urgent{border-left-color:var(--rust);background:linear-gradient(#3b302e,#2c2523)}
.order.urgent .order__tag{color:var(--rust)}
.order.urgent .order__timer i{background:var(--rust)}
.order.flash-ok{animation:flashOk .45s ease-out}
.order.flash-bad{animation:flashBad .45s ease-out}
@keyframes flashOk{0%{background:#3d5b4b}100%{background:#28322f}}
@keyframes flashBad{0%{background:#5b3229}100%{background:#28322f}}

/* ── 計器盤 ── */
.panel{
  display:grid;gap:10px;
  grid-template-columns:repeat(3,minmax(0,1fr));  /* 6計器＝3×2で必ず割り切れる */
  padding:12px;
  background:linear-gradient(#2a3433,#242d2c);
  border:2px solid var(--stroke);
}
.stage.solo .station{width:100%;max-width:1080px;margin-inline:auto}
.stage.drill .panel{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:1180px){.stage.drill .panel{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){.panel{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:460px){.panel{grid-template-columns:minmax(0,1fr)}}
.ctrl{
  display:flex;flex-direction:column;gap:7px;
  padding:9px 10px 8px;
  background:var(--panel);
  border:1px solid #1b2322;
  border-top:1px solid #45524f;
  min-width:0;
}
.ctrl__label{display:flex;flex-direction:column;gap:1px;min-width:0}
.ctrl__label b{font-weight:700;font-size:13px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctrl__label span{font-family:var(--f-en);font-weight:500;font-size:9px;letter-spacing:.16em;color:var(--ivory-faint)}
.ctrl__read{
  font-family:var(--f-en);font-weight:700;font-size:14px;letter-spacing:.04em;
  font-variant-numeric:tabular-nums;color:var(--accent);
  background:var(--recess);border:1px solid var(--stroke);
  padding:1px 7px;align-self:flex-start;min-width:62px;text-align:center;
}

/* 検出溝つまみ（notch） */
.notch{position:relative;padding:9px 4px 3px}
.notch__track{position:relative;height:5px;background:var(--recess);border:1px solid var(--stroke)}
.notch__pin{
  position:absolute;top:-7px;width:13px;height:19px;margin-left:-6.5px;
  background:linear-gradient(#e6e0d0,#a8a698);border:1px solid #12100c;
  transition:left .12s cubic-bezier(.3,1.4,.5,1);
}
.notch__stops{display:flex;margin-top:5px}
.notch__stops button{
  flex:1;font-family:var(--f-en);font-weight:500;font-size:10px;
  color:var(--ivory-faint);padding:2px 0;border-top:1px solid #3d4a47;
}
.notch__stops button:hover{color:var(--ivory);background:#38443f}
.notch__stops button[aria-checked="true"]{color:var(--accent);font-weight:700}

/* 選択灯（select） */
.lamps{display:flex;flex-direction:column;gap:3px}
.lamps button{
  display:flex;align-items:center;gap:7px;padding:3px 7px;
  background:var(--recess);border:1px solid var(--stroke);
  font-size:12px;color:var(--ivory-dim);text-align:left;
}
.lamps button:hover{background:#1d2524;color:var(--ivory)}
.lamps .dot{width:8px;height:8px;border-radius:50%;background:#2f3b39;border:1px solid #0a0e0d;flex:none}
.lamps button[aria-checked="true"]{color:var(--ivory)}
.lamps button[aria-checked="true"] .dot{background:var(--accent);box-shadow:0 0 7px var(--accent)}

/* 転換器（toggle） */
.rocker{
  position:relative;display:flex;height:36px;
  background:var(--recess);border:1px solid var(--stroke);
}
.rocker__slab{
  position:absolute;top:2px;bottom:2px;width:calc(50% - 3px);left:2px;
  background:linear-gradient(#4a5754,#33403d);border:1px solid #12100c;
  transition:left .14s cubic-bezier(.3,1.4,.5,1);
}
.rocker__slab.on{left:calc(50% + 1px)}
.rocker button{
  position:relative;flex:1;font-size:12px;font-weight:700;color:var(--ivory-faint);
}
.rocker button[aria-checked="true"]{color:var(--accent)}

/* 打鍵釦（button） */
.punch{
  align-self:center;width:62px;height:62px;border-radius:50%;
  background:
    repeating-linear-gradient(135deg,#c4523a 0 8px,#8f3a29 8px 16px);
  border:3px solid #1b1512;
  box-shadow:0 4px 0 #14100e, inset 0 2px 4px rgba(255,255,255,.18);
  font-family:var(--f-en);font-weight:700;font-size:11px;letter-spacing:.12em;color:#fff2e6;
  text-shadow:0 1px 2px rgba(0,0,0,.6);
}
.punch:active{transform:translateY(3px);box-shadow:0 1px 0 #14100e, inset 0 2px 4px rgba(0,0,0,.3)}
.ctrl--button{align-items:center}
.ctrl--button .ctrl__label{align-items:center;text-align:center}
.ctrl--button .ctrl__read{align-self:center}

/* 目標指令の縁取り（自分の盤が指名されたとき点る） */
.ctrl.wanted{border-color:var(--warn);box-shadow:0 0 0 1px var(--warn)}

/* ── 乗員レール ── */
.crew{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:10px 20px 14px;border-top:2px solid var(--stroke);
  background:linear-gradient(#212a29,#1b2322);
}
.crew__cap{font-family:var(--f-en);font-weight:700;font-size:10px;letter-spacing:.2em;color:var(--ivory-faint)}
.seat{
  display:flex;align-items:center;gap:8px;padding:4px 10px;
  background:#26302f;border:1px solid #36423f;min-width:150px;
}
.seat .dot{width:7px;height:7px;border-radius:50%;background:var(--ivory-faint);flex:none}
.seat.live .dot{background:var(--sea);box-shadow:0 0 6px var(--sea)}
.seat.me{border-color:var(--warn)}
.seat b{font-weight:700;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat span{font-family:var(--f-en);font-size:10px;letter-spacing:.14em;color:var(--ivory-faint);margin-left:auto}
.seat.ready span{color:var(--sea)}

/* ── 幕（説明・結果） ── */
.veil{
  position:fixed;inset:0;z-index:30;
  display:flex;align-items:center;justify-content:center;padding:24px;
  background:rgba(14,19,18,.86);
  backdrop-filter:blur(3px);
  overflow-y:auto;
}
.veil[hidden]{display:none}
.card{
  width:min(680px,100%);
  background:linear-gradient(#2d3836,#242d2c);
  border:2px solid var(--stroke);
  box-shadow:0 18px 50px rgba(0,0,0,.55);
  padding:26px 30px 24px;
}
.card h1{
  margin:0;font-weight:900;font-size:30px;letter-spacing:.04em;
}
.card .sub{
  font-family:var(--f-en);font-weight:500;font-size:11px;letter-spacing:.28em;
  color:var(--ivory-faint);margin-top:2px;
}
.card .lede{margin:14px 0 0;color:var(--ivory-dim);max-width:60ch}
.rule{height:1px;background:#3b4744;margin:18px 0}
.steps{display:flex;flex-direction:column;gap:9px;margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{display:flex;gap:11px;align-items:flex-start}
.steps li::before{
  counter-increment:s;content:counter(s);
  font-family:var(--f-en);font-weight:700;font-size:12px;
  color:var(--hull);background:var(--accent);
  width:19px;height:19px;flex:none;display:grid;place-items:center;margin-top:2px;
}
.steps b{font-weight:700}
.steps p{margin:0;color:var(--ivory-dim);font-size:13px}
.note{
  margin-top:16px;padding:9px 12px;border-left:3px solid var(--warn);
  background:rgba(224,165,60,.08);color:var(--ivory-dim);font-size:12.5px;
}
.note.bad{border-left-color:var(--rust);background:rgba(196,82,58,.1)}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;align-items:center}
.btn{
  padding:11px 22px;font-weight:700;font-size:14px;letter-spacing:.03em;
  background:var(--accent);color:#1a2120;border:1px solid var(--stroke);
}
.btn:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.btn--ghost{background:transparent;color:var(--ivory-dim);border:1px solid #46534f}
.btn--ghost:hover{color:var(--ivory);border-color:var(--ivory-faint);filter:none}
.namefield{
  background:var(--recess);border:1px solid var(--stroke);color:var(--ivory);
  font:inherit;font-size:14px;padding:10px 12px;width:190px;
}
.namefield::placeholder{color:var(--ivory-faint)}

.result{display:flex;align-items:flex-end;gap:26px;flex-wrap:wrap;margin-top:6px}
.result .big{
  font-family:var(--f-en);font-weight:700;font-size:64px;line-height:.9;
  font-variant-numeric:tabular-nums;color:var(--signal);
}
.result .big span{font-size:22px;color:var(--ivory-dim);margin-left:6px}
.tally{display:flex;gap:22px;flex-wrap:wrap}
.tally div{display:flex;flex-direction:column}
.tally .cap{font-family:var(--f-en);font-weight:700;font-size:10px;letter-spacing:.18em;color:var(--ivory-faint)}
.tally .num{font-family:var(--f-en);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}

.roster{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.roster .row{
  display:flex;align-items:center;gap:10px;padding:6px 10px;
  background:var(--recess);border:1px solid var(--stroke);font-size:13px;
}
.roster .row .dot{width:7px;height:7px;border-radius:50%;background:var(--ivory-faint);flex:none}
.roster .row.live .dot{background:var(--sea);box-shadow:0 0 6px var(--sea)}
.roster .row .st{font-family:var(--f-en);font-size:10px;letter-spacing:.16em;color:var(--ivory-faint);margin-left:auto}
.roster .row.ready .st{color:var(--sea)}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
</style>

<div class="hull">
  <header class="rail">
    <div class="mark"><b>深海艇ネレイド</b><span>DSV NEREID / 3-SEAT DIVE</span></div>
    <div class="gauge">
      <div class="cap">DEPTH</div>
      <div class="val" id="depthVal">0</div><div class="unit">m</div>
    </div>
    <div class="gauge">
      <div class="cap">HULL</div>
      <div class="val" id="hullVal">100</div><div class="unit">%</div>
      <div class="hullbar"><i id="hullBar" style="width:100%"></i></div>
    </div>
    <button class="railbtn" id="soundBtn" aria-pressed="true">SOUND ON</button>
    <button class="railbtn" id="helpBtn">手順</button>
  </header>

  <main class="stage solo" id="stage"></main>

  <footer class="crew">
    <div class="crew__cap">CREW</div>
    <div id="crewList" style="display:flex;gap:8px;flex-wrap:wrap"></div>
  </footer>
</div>

<div class="veil" id="veil">
  <div class="card" id="card"></div>
</div>

<script>
"use strict";

/* ══════════════════════════════════════════════════════════
   計器目録 ── 3局。指令は必ず「他人の局の計器」を指す
   ══════════════════════════════════════════════════════════ */
const STATIONS = [
  { jp:"機関室", en:"ENGINE ROOM", accent:"var(--brass)", controls:[
    { id:"e1", jp:"主機出力",   en:"MAIN DRIVE",    type:"notch",  unit:"%",   vals:["0","25","50","75","100"] },
    { id:"e2", jp:"冷却水弁",   en:"COOLANT VALVE", type:"notch",  unit:"",    vals:["閉","1","2","3","全開"] },
    { id:"e3", jp:"蓄電池",     en:"BATTERY BUS",   type:"select", unit:"",    vals:["A系","B系","並列"] },
    { id:"e4", jp:"非常発電",   en:"EMERG GEN",     type:"toggle", unit:"",    vals:["停止","起動"] },
    { id:"e5", jp:"推力偏向",   en:"THRUST VECTOR", type:"notch",  unit:"°",   vals:["−30","−15","0","+15","+30"] },
    { id:"e6", jp:"過負荷遮断", en:"OVERLOAD CUT",  type:"button", unit:"",    vals:["打鍵"] },
  ]},
  { jp:"生命維持", en:"LIFE SUPPORT", accent:"var(--sea)", controls:[
    { id:"l1", jp:"酸素分圧",   en:"O2 PARTIAL",    type:"notch",  unit:"bar", vals:["0.18","0.21","0.24","0.28","0.32"] },
    { id:"l2", jp:"炭酸吸収",   en:"CO2 SCRUBBER",  type:"select", unit:"",    vals:["停止","低速","高速"] },
    { id:"l3", jp:"艙内与圧",   en:"CABIN PRESS",   type:"notch",  unit:"bar", vals:["1.0","1.4","1.8","2.2","2.6"] },
    { id:"l4", jp:"循環ファン", en:"CIRC FAN",      type:"toggle", unit:"",    vals:["停止","起動"] },
    { id:"l5", jp:"予備空気",   en:"RESERVE AIR",   type:"select", unit:"",    vals:["封鎖","均圧","開放"] },
    { id:"l6", jp:"警報消音",   en:"ALARM MUTE",    type:"button", unit:"",    vals:["打鍵"] },
  ]},
  { jp:"操艦", en:"HELM", accent:"var(--signal)", controls:[
    { id:"h1", jp:"主バラスト", en:"MAIN BALLAST",  type:"notch",  unit:"",    vals:["注水","半注","中立","半排","排水"] },
    { id:"h2", jp:"トリム角",   en:"TRIM ANGLE",    type:"notch",  unit:"°",   vals:["−10","−5","0","+5","+10"] },
    { id:"h3", jp:"ソナー利得", en:"SONAR GAIN",    type:"notch",  unit:"",    vals:["0","25","50","75","100"] },
    { id:"h4", jp:"投光器",     en:"FLOODLIGHT",    type:"toggle", unit:"",    vals:["消灯","点灯"] },
    { id:"h5", jp:"マニピュレータ", en:"MANIPULATOR", type:"select", unit:"", vals:["格納","待機","展開"] },
    { id:"h6", jp:"緊急吹鳴",   en:"EMERG HORN",    type:"button", unit:"",    vals:["打鍵"] },
  ]},
];

const GOAL = 2000;                       // 海溝底（m）
const HULL_MAX = 100;
const MISS_COST = 18;                    // 時間切れ
const SLIP_COST = 4;                     // 誤操作
const SEAT_LABEL = ["ENGINE","LIFE","HELM"];

function ctrlOf(seat, id){ return STATIONS[seat].controls.find(c => c.id === id); }
function gainFor(d){ return 35 + Math.floor(d / 300) * 10; }
function timerFor(d){ return Math.max(6500, 16000 - d * 7); }

/* ══════════════════════════════════════════════════════════
   状態
   ══════════════════════════════════════════════════════════ */
let room = null;                 // room 名前空間（null＝この端末は接続不可）
let roomFailed = false;
let peersNow = [];               // room.peers() の写し
let mode = "idle";               // idle | drill | online
let nick = "";
let myReady = false;

const localPanels = [{}, {}, {}]; // 単独訓練で使う3局ぶんの盤面
const myPanel = {};               // 通信対戦で使う自分の盤面

let game = null;                  // 艇長（ホスト）が持つ正本
let mirror = null;                // 追従側が受け取った写し
let mirrorAt = 0;                 // 写しを受け取った時刻（performance.now）
let evSeen = 0;
let evSeq = 0;

const ui = { seats: [], rendered: null };

function freshPanel(seat){
  const p = {};
  for(const c of STATIONS[seat].controls) p[c.id] = 0;
  return p;
}
function resetPanels(){
  for(let s = 0; s < 3; s++) Object.assign(localPanels[s], freshPanel(s));
  Object.keys(myPanel).forEach(k => delete myPanel[k]);
}

/* ══════════════════════════════════════════════════════════
   同席者
   ══════════════════════════════════════════════════════════ */
function crew(){
  return peersNow
    .filter(p => p.kind === "viewer")
    .slice()
    .sort((a, b) => (a.peer < b.peer ? -1 : a.peer > b.peer ? 1 : 0));
}
function mySeat(){
  if(mode === "drill") return 0;
  return crew().findIndex(p => p.isMe && p.sameTab);
}
function amCaptain(){          // 一番若い peer が進行役を務める
  const c = crew();
  return c.length > 0 && c[0].isMe && c[0].sameTab;
}
function activeSeats(){
  if(mode === "drill") return [0, 1, 2];
  return crew().slice(0, 3).map((_, i) => i);
}
function panelOf(seat){
  if(mode === "drill") return localPanels[seat];
  const c = crew()[seat];
  if(!c) return {};
  if(c.isMe && c.sameTab) return myPanel;
  const p = c.presence && c.presence.p;
  return (p && typeof p === "object") ? p : {};
}
function view(){               // 描画に使う進行状態
  if(mode === "drill") return game;
  return amCaptain() ? game : mirror;
}

/* ══════════════════════════════════════════════════════════
   指令の生成
   ══════════════════════════════════════════════════════════ */
let orderId = 0;
function makeOrder(reader, seats, st){
  const others = seats.filter(s => s !== reader);
  if(!others.length) return null;
  const taken = new Set(st.o.filter(Boolean).map(o => o.c));

  const pool = [];
  for(const s of others){
    for(const c of STATIONS[s].controls){
      if(taken.has(c.id)) continue;
      pool.push({ s, c });
    }
  }
  if(!pool.length) return null;

  const pick = pool[(Math.random() * pool.length) | 0];
  const panel = panelOf(pick.s);
  const cur = panel[pick.c.id] || 0;

  let want = 0, text = "";
  if(pick.c.type === "button"){
    want = cur;                                   // 押下回数の基準
    text = `${pick.c.jp}を叩け`;
  }else{
    const opts = pick.c.vals.map((_, i) => i).filter(i => i !== cur);
    want = opts[(Math.random() * opts.length) | 0];
    const label = pick.c.vals[want] + (pick.c.unit ? " " + pick.c.unit : "");
    text = pick.c.type === "toggle"
      ? `${pick.c.jp}を${label}`
      : `${pick.c.jp}を${label}に`;
  }

  const urgent = st.d >= 600 && Math.random() < 0.22;
  const tot = Math.round(timerFor(st.d) * (urgent ? 0.62 : 1));
  return { i: ++orderId, s: pick.s, c: pick.c.id, v: want, b: cur, t: text, ms: tot, tot, u: urgent };
}

/* ══════════════════════════════════════════════════════════
   進行（艇長のみが回す）
   ══════════════════════════════════════════════════════════ */
function newGame(){
  return { ph:"lobby", d:0, h:HULL_MAX, o:[null,null,null], ok:0, miss:0, slip:0, win:false, ev:[], prev:[{},{},{}] };
}
function pushEv(seat, kind){
  game.ev.push({ i: ++evSeq, s: seat, k: kind });
  if(game.ev.length > 5) game.ev.shift();
}
function startDive(){
  const keep = game.ev;
  Object.assign(game, newGame(), { ph:"dive", ev: keep });
  resetPanels();
  myReady = false;
  const seats = activeSeats();
  for(const s of seats) game.prev[s] = Object.assign({}, panelOf(s));
  for(const s of seats) game.o[s] = makeOrder(s, seats, game);
}

function captainTick(dt){
  const st = game;
  const seats = activeSeats();

  if(st.ph === "lobby"){
    const ready = crew().slice(0, 3);
    if(mode === "online" && ready.length >= 2 && ready.every(p => p.presence && p.presence.r === true)){
      startDive();
    }
    return;
  }
  if(st.ph !== "dive") return;

  // 誤操作の検出（正しい操作より先に判定すると誤爆するので、望まれた値かを先に照合）
  for(const s of seats){
    const panel = panelOf(s);
    const prev = st.prev[s] || {};
    for(const c of STATIONS[s].controls){
      const cur = panel[c.id] || 0, was = prev[c.id] || 0;
      if(cur === was) continue;
      const wanted = st.o.some(o => o && o.s === s && o.c === c.id &&
        (c.type === "button" ? true : o.v === cur));
      if(!wanted){ st.h -= SLIP_COST; st.slip++; pushEv(s, "slip"); }
    }
    st.prev[s] = Object.assign({}, panel);
  }

  // 指令の消化
  for(const s of seats){
    const o = st.o[s];
    if(!o){ st.o[s] = makeOrder(s, seats, st); continue; }
    const c = ctrlOf(o.s, o.c);
    const val = panelOf(o.s)[o.c] || 0;
    const done = c.type === "button" ? val > o.b : val === o.v;
    if(done){
      st.d += gainFor(st.d); st.ok++; pushEv(s, "ok"); st.o[s] = null;
    }else{
      o.ms -= dt;
      if(o.ms <= 0){ st.h -= MISS_COST; st.miss++; pushEv(s, "miss"); st.o[s] = null; }
    }
  }

  if(st.h <= 0){ st.h = 0; st.ph = "over"; st.win = false; st.o = [null,null,null]; }
  else if(st.d >= GOAL){ st.d = GOAL; st.ph = "over"; st.win = true; st.o = [null,null,null]; }
}

/* ══════════════════════════════════════════════════════════
   通信 ── presence だけで完結させる
     自分の presence : { p:盤面, n:名前, r:配置済み, hs:進行状態(艇長のみ) }
   ══════════════════════════════════════════════════════════ */
let lastPush = 0;
function pushPresence(force){
  if(!room || mode !== "online") return;
  const t = performance.now();
  if(!force && t - lastPush < 90) return;
  lastPush = t;
  const patch = { p: Object.assign({}, myPanel), n: nick || "乗員", r: myReady };
  if(amCaptain() && game){
    patch.hs = {
      ph: game.ph, d: Math.round(game.d), h: Math.round(game.h),
      ok: game.ok, miss: game.miss, slip: game.slip, win: game.win,
      o: game.o.map(o => o ? { i:o.i, s:o.s, c:o.c, t:o.t, ms:Math.max(0,Math.round(o.ms)), tot:o.tot, u:o.u } : null),
      ev: game.ev.slice(-3),
    };
  }else{
    patch.hs = null;
  }
  room.presence(patch).catch(() => {});
}

function readMirror(){
  const c = crew();
  if(!c.length) return;
  const hs = c[0].presence && c[0].presence.hs;
  if(hs && typeof hs === "object"){
    if(mirror !== hs){ mirror = hs; mirrorAt = performance.now(); }
  }
}

async function connect(){
  try{ room = await claude.use("room"); }catch(e){ room = null; }
  if(!room){ roomFailed = true; if(mode !== "drill") drawVeil(); return; }

  room.onPeers(change => {
    peersNow = change.peers;
    if(mode === "online"){
      if(amCaptain() && !game) game = newGame();
      readMirror();
      layout();
      drawVeil();
    }
    drawCrew();
  }, () => { roomFailed = true; drawVeil(); });

  room.onConnection(() => { drawCrew(); }, () => {});
  drawVeil();
}

/* ══════════════════════════════════════════════════════════
   盤面の組み立て
   ══════════════════════════════════════════════════════════ */
const stage = document.getElementById("stage");

function seatsToRender(){
  if(mode === "drill") return [0, 1, 2];
  const s = mySeat();
  return s >= 0 && s < 3 ? [s] : [];
}

function layout(){
  const seats = seatsToRender();
  const key = mode + ":" + seats.join(",");
  if(ui.rendered === key) return;
  ui.rendered = key;
  stage.className = "stage " + (seats.length > 1 ? "drill" : "solo");
  stage.textContent = "";
  ui.seats = [];

  for(const s of seats) stage.appendChild(buildStation(s));
}

function buildStation(seat){
  const st = STATIONS[seat];
  const wrap = document.createElement("section");
  wrap.className = "station";
  wrap.style.setProperty("--accent", st.accent);

  const head = document.createElement("div");
  head.className = "station__head";
  head.innerHTML = `<b></b><span></span>`;
  head.children[0].textContent = st.jp;
  head.children[1].textContent = st.en;
  wrap.appendChild(head);

  const order = document.createElement("div");
  order.className = "order";
  order.innerHTML =
    `<div class="order__tag">ORDER</div>` +
    `<div class="order__text order__idle">待機中</div>` +
    `<div class="order__timer"><i></i></div>`;
  wrap.appendChild(order);

  const panel = document.createElement("div");
  panel.className = "panel";
  const refs = [];
  for(const c of st.controls) refs.push(buildControl(seat, c, panel));
  wrap.appendChild(panel);

  ui.seats[seat] = {
    order,
    orderText: order.querySelector(".order__text"),
    timer: order.querySelector(".order__timer i"),
    controls: refs,
    lastOrderId: 0,
  };
  return wrap;
}

function setValue(seat, c, v){
  const panel = (mode === "drill") ? localPanels[seat] : myPanel;
  if(c.type === "button") panel[c.id] = (panel[c.id] || 0) + 1;
  else panel[c.id] = v;
  pushPresence(true);
  paintControls();
  blip(c.type === "button" ? 520 : 340, 0.045);
}

function buildControl(seat, c, parent){
  const box = document.createElement("div");
  box.className = "ctrl ctrl--" + c.type;

  const label = document.createElement("div");
  label.className = "ctrl__label";
  label.innerHTML = `<b></b><span></span>`;
  label.children[0].textContent = c.jp;
  label.children[1].textContent = c.en;
  box.appendChild(label);

  const read = document.createElement("div");
  read.className = "ctrl__read";
  const opts = [];
  let pin = null, slab = null;

  if(c.type === "notch"){
    const w = document.createElement("div");
    w.className = "notch";
    w.innerHTML = `<div class="notch__track"><div class="notch__pin"></div></div><div class="notch__stops"></div>`;
    pin = w.querySelector(".notch__pin");
    const stops = w.querySelector(".notch__stops");
    c.vals.forEach((v, i) => {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = v;
      b.setAttribute("role", "radio"); b.setAttribute("aria-label", `${c.jp} ${v}`);
      b.addEventListener("click", () => setValue(seat, c, i));
      stops.appendChild(b); opts.push(b);
    });
    box.appendChild(w);
  }else if(c.type === "select"){
    const w = document.createElement("div");
    w.className = "lamps";
    c.vals.forEach((v, i) => {
      const b = document.createElement("button");
      b.type = "button"; b.setAttribute("role", "radio");
      b.innerHTML = `<i class="dot"></i><span></span>`;
      b.querySelector("span").textContent = v;
      b.setAttribute("aria-label", `${c.jp} ${v}`);
      b.addEventListener("click", () => setValue(seat, c, i));
      w.appendChild(b); opts.push(b);
    });
    box.appendChild(w);
  }else if(c.type === "toggle"){
    const w = document.createElement("div");
    w.className = "rocker";
    w.innerHTML = `<div class="rocker__slab"></div>`;
    slab = w.querySelector(".rocker__slab");
    c.vals.forEach((v, i) => {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = v; b.setAttribute("role", "radio");
      b.setAttribute("aria-label", `${c.jp} ${v}`);
      b.addEventListener("click", () => setValue(seat, c, i));
      w.appendChild(b); opts.push(b);
    });
    box.appendChild(w);
  }else{
    const b = document.createElement("button");
    b.type = "button"; b.className = "punch"; b.textContent = "PUSH";
    b.setAttribute("aria-label", `${c.jp} を叩く`);
    b.addEventListener("click", () => setValue(seat, c, 0));
    box.appendChild(b);
  }

  box.appendChild(read);
  parent.appendChild(box);
  return { c, seat, box, read, opts, pin, slab };
}

/* ══════════════════════════════════════════════════════════
   描画
   ══════════════════════════════════════════════════════════ */
function paintControls(){
  const st = view();
  for(const seat of seatsToRender()){
    const refs = ui.seats[seat];
    if(!refs) continue;
    const panel = panelOf(seat);
    for(const r of refs.controls){
      const v = panel[r.c.id] || 0;
      if(r.c.type === "button"){
        r.read.textContent = v ? v + " 回" : "—";
      }else{
        r.read.textContent = r.c.vals[v] + (r.c.unit ? " " + r.c.unit : "");
        r.opts.forEach((b, i) => b.setAttribute("aria-checked", String(i === v)));
        if(r.pin) r.pin.style.left = ((v + 0.5) / r.c.vals.length * 100) + "%";
        if(r.slab) r.slab.classList.toggle("on", v === 1);
      }
      const wanted = !!(st && st.ph === "dive" && st.o.some(o => o && o.s === seat && o.c === r.c.id));
      r.box.classList.toggle("wanted", wanted);
    }
  }
}

function paintOrders(){
  const st = view();
  const seats = seatsToRender();
  const elapsed = (mode === "online" && !amCaptain()) ? performance.now() - mirrorAt : 0;

  for(const seat of seats){
    const refs = ui.seats[seat];
    if(!refs) continue;
    const o = st && st.ph === "dive" ? st.o[seat] : null;
    if(!o){
      refs.orderText.classList.add("order__idle");
      refs.orderText.textContent = st && st.ph === "dive" ? "次の指令を待て" : "待機中";
      refs.timer.style.width = "0%";
      refs.order.classList.remove("urgent");
      continue;
    }
    if(refs.lastOrderId !== o.i){
      refs.lastOrderId = o.i;
      if(seat === mySeat() || mode === "drill") blip(o.u ? 880 : 660, 0.07);
    }
    refs.orderText.classList.remove("order__idle");
    refs.orderText.textContent = o.t;
    refs.order.classList.toggle("urgent", !!o.u);
    refs.order.querySelector(".order__tag").textContent = o.u ? "緊急指令 / PRIORITY" : "ORDER";
    const left = Math.max(0, o.ms - elapsed);
    refs.timer.style.width = Math.max(0, Math.min(100, left / o.tot * 100)) + "%";
  }
}

const depthVal = document.getElementById("depthVal");
const hullVal = document.getElementById("hullVal");
const hullBar = document.getElementById("hullBar");

function paintRail(){
  const st = view();
  const d = st ? Math.round(st.d) : 0;
  const h = st ? Math.max(0, Math.round(st.h)) : HULL_MAX;
  depthVal.textContent = d.toLocaleString("ja-JP");
  hullVal.textContent = h;
  hullBar.style.width = (h / HULL_MAX * 100) + "%";
  const cls = h <= 30 ? "crit" : h <= 64 ? "hurt" : "";
  hullVal.className = "val " + cls;
  hullBar.className = cls;
}

const crewList = document.getElementById("crewList");
function drawCrew(){
  crewList.textContent = "";
  if(mode === "drill"){
    for(let s = 0; s < 3; s++){
      const el = document.createElement("div");
      el.className = "seat live me";
      el.innerHTML = `<i class="dot"></i><b></b><span></span>`;
      el.children[1].textContent = STATIONS[s].jp;
      el.children[2].textContent = "単独訓練";
      crewList.appendChild(el);
    }
    return;
  }
  const c = crew();
  if(!c.length){
    const el = document.createElement("div");
    el.className = "seat";
    el.innerHTML = `<i class="dot"></i><b>接続中…</b>`;
    crewList.appendChild(el);
    return;
  }
  c.slice(0, 4).forEach((p, i) => {
    const el = document.createElement("div");
    const ready = p.presence && p.presence.r === true;
    el.className = "seat live" + (p.isMe && p.sameTab ? " me" : "") + (ready ? " ready" : "");
    el.innerHTML = `<i class="dot"></i><b></b><span></span>`;
    el.children[1].textContent = ((p.presence && p.presence.n) || "乗員") + (p.isMe && p.sameTab ? "（あなた）" : "");
    el.children[2].textContent = i < 3 ? SEAT_LABEL[i] : "観測";
    crewList.appendChild(el);
  });
}

/* ── 効果音（合成、初回操作で起動） ── */
let ac = null, soundOn = true;
function blip(freq, len){
  if(!soundOn) return;
  try{
    if(!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if(ac.state === "suspended") ac.resume();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = "square"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.09, ac.currentTime + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + len);
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime + len + 0.02);
  }catch(e){}
}
function chord(freqs, len){ freqs.forEach((f, i) => setTimeout(() => blip(f, len), i * 55)); }

function playEvents(){
  const st = view();
  if(!st || !st.ev) return;
  const me = mySeat();
  for(const e of st.ev){
    if(e.i <= evSeen) continue;
    evSeen = e.i;
    const mine = mode === "drill" || e.s === me;
    if(e.k === "ok" && mine) chord([700, 990], 0.06);
    else if(e.k === "miss") chord([300, 180], 0.16);
    else if(e.k === "slip" && mine) blip(150, 0.1);
    const refs = ui.seats[e.s];
    if(refs && (mine || mode === "drill")){
      const cls = e.k === "ok" ? "flash-ok" : "flash-bad";
      refs.order.classList.remove("flash-ok", "flash-bad");
      void refs.order.offsetWidth;
      refs.order.classList.add(cls);
    }
  }
}

/* ══════════════════════════════════════════════════════════
   幕（説明・結果）
   ══════════════════════════════════════════════════════════ */
const veil = document.getElementById("veil");
const card = document.getElementById("card");

function drawVeil(){
  const st = view();
  if(mode !== "idle" && st && st.ph === "dive"){ veil.hidden = true; return; }
  veil.hidden = false;
  if(st && st.ph === "over") return drawResult(st);
  drawBriefing();
}

function drawBriefing(){
  const online = !!room && !roomFailed;
  const c = crew();
  card.innerHTML = `
    <h1>深海艇ネレイド</h1>
    <div class="sub">DSV NEREID / 3-SEAT DIVE</div>
    <p class="lede">3人の乗員が、それぞれ<b>違う計器盤</b>の前に座る。あなたの画面に出る指令は、<b>必ず他の誰かの盤の計器</b>を指している。声に出して読み上げ、叫び合って処理しろ。海溝底 2,000 m を目指す。</p>
    <div class="rule"></div>
    <ol class="steps">
      <li><div><b>このページのURLを2人に送る</b><p>3人が同じURLを開けば、自動で機関室・生命維持・操艦に配席される。</p></div></li>
      <li><div><b>通話をつなぐ</b><p>Discord などで声が通っていることが前提のゲーム。文字では間に合わない。</p></div></li>
      <li><div><b>全員が「配置につく」を押す</b><p>揃った瞬間に潜航開始。指令を読み上げ、自分の盤に該当があれば即座に操作。</p></div></li>
    </ol>
    <div class="note">指令の時間切れは船殻 −18％、誰も頼んでいない計器をいじると −4％。船殻が 0 になれば圧壊。</div>
    ${online ? "" : `<div class="note bad">この画面では通信対戦の接続ができない（未共有・権限・通信断のいずれか）。単独訓練は問題なく遊べる。</div>`}
    <div class="roster" id="rosterBox"></div>
    <div class="acts">
      <input class="namefield" id="nickIn" maxlength="12" placeholder="乗員名" value="${escapeAttr(nick)}" ${online ? "" : "disabled"}>
      <button class="btn" id="readyBtn" ${online ? "" : "disabled"}>${myReady ? "配置を解く" : "配置につく"}</button>
      <button class="btn btn--ghost" id="drillBtn">単独訓練（3局とも自分で操作）</button>
    </div>
  `;

  const roster = card.querySelector("#rosterBox");
  if(online){
    if(!c.length){
      roster.innerHTML = `<div class="row"><i class="dot"></i>乗員を探している…</div>`;
    }else{
      c.slice(0, 4).forEach((p, i) => {
        const ready = p.presence && p.presence.r === true;
        const row = document.createElement("div");
        row.className = "row live" + (ready ? " ready" : "");
        row.innerHTML = `<i class="dot"></i><b></b><span style="color:var(--ivory-dim);margin-left:8px"></span><span class="st"></span>`;
        row.children[1].textContent = ((p.presence && p.presence.n) || "乗員") + (p.isMe && p.sameTab ? "（あなた）" : "");
        row.children[2].textContent = i < 3 ? STATIONS[i].jp : "観測員";
        row.children[3].textContent = ready ? "READY" : "STANDBY";
        roster.appendChild(row);
      });
      if(c.length < 2){
        const row = document.createElement("div");
        row.className = "row";
        row.innerHTML = `<i class="dot"></i>あと ${2 - c.length} 人（推奨 3 人）`;
        roster.appendChild(row);
      }
    }
  }

  const nickIn = card.querySelector("#nickIn");
  if(nickIn) nickIn.addEventListener("input", e => { nick = e.target.value.slice(0, 12); pushPresence(true); });

  const readyBtn = card.querySelector("#readyBtn");
  if(readyBtn) readyBtn.addEventListener("click", () => {
    mode = "online";
    myReady = !myReady;
    if(amCaptain() && !game) game = newGame();
    pushPresence(true);
    layout(); drawCrew(); drawVeil();
    blip(760, 0.06);
  });

  card.querySelector("#drillBtn").addEventListener("click", () => {
    mode = "drill";
    game = newGame();
    startDive();
    ui.rendered = null;
    layout(); drawCrew(); drawVeil();
    chord([520, 700], 0.07);
  });

function drawResult(st){
  const win = st.win;
  card.innerHTML = `

        <div><div class="cap">MIS-OP</div><div class="num">${st.slip}</div></div>
      </div>
    </div>
    <p class="lede">${win
      ? "全員の声が通っていた。ネレイドは海溝底に着底し、採泥装置を展開した。"
      : "誰かの指令が誰にも届かないまま、水圧が耐圧殻を上回った。もう一度潜れ。"}</p>
    <div class="acts">
      <button class="btn" id="againBtn">${mode === "drill" ? "もう一度潜る" : (myReady ? "配置を解く" : "もう一度潜る")}</button>
      <button class="btn btn--ghost" id="backBtn">説明に戻る</button>
    </div>
  `;
  card.querySelector("#againBtn").addEventListener("click", () => {
    if(mode === "drill"){ startDive(); drawVeil(); return; }
    myReady = !myReady;
    if(amCaptain()){ game.ph = "lobby"; game.ev = []; }
    pushPresence(true);
    drawVeil();
  });
  card.querySelector("#backBtn").addEventListener("click", () => {
    if(mode === "drill"){ mode = "idle"; game = null; ui.rendered = null; layout(); }
    else if(amCaptain() && game){ game.ph = "lobby"; }
    myReady = false; pushPresence(true);
    drawCrew(); drawVeil();
  });
}

function escapeAttr(s){ return String(s).replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch])); }

/* ══════════════════════════════════════════════════════════
   主ループ
   ══════════════════════════════════════════════════════════ */
let last = performance.now();
let prevPhase = null;

function frame(now){
  const dt = Math.min(120, now - last);
  last = now;

  if(mode === "online") readMirror();
  if((mode === "drill" || (mode === "online" && amCaptain())) && game) captainTick(dt);
  if(mode === "online") pushPresence(false);

  const st = view();
  const ph = st ? st.ph : null;
  if(ph !== prevPhase){
    prevPhase = ph;
    if(ph === "dive"){ ui.rendered = null; layout(); }
    drawVeil(); drawCrew();
  }

  paintRail();
  paintOrders();
  paintControls();
  playEvents();
  requestAnimationFrame(frame);
}

/* ── 起動 ── */
document.getElementById("soundBtn").addEventListener("click", e => {
  soundOn = !soundOn;
  e.target.textContent = soundOn ? "SOUND ON" : "SOUND OFF";
  e.target.setAttribute("aria-pressed", String(soundOn));
  if(soundOn) blip(660, 0.06);
});
document.getElementById("helpBtn").addEventListener("click", () => {
  if(view() && view().ph === "dive") return;
  veil.hidden = false; drawBriefing();
});

resetPanels();
layout();
drawCrew();
drawVeil();
requestAnimationFrame(frame);
connect();
</script>
